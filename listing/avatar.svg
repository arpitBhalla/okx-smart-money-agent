<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Polydash: the Datadash grid mark, drawn as a P. Cells shade dark to light along the diagonal, as in the Datadash D. -->
  <rect width="512" height="512" rx="112" fill="#120F24"/>
  <g stroke="#120F24" stroke-width="4" stroke-linejoin="round">
    <!-- bowl, row 1 -->
    <rect x="96" y="96" width="80" height="80" fill="#4E3DC9"/>
    <rect x="176" y="96" width="80" height="80" fill="#6247EA"/>
    <rect x="256" y="96" width="80" height="80" fill="#7653F6"/>
    <path d="M336 96 A80 80 0 0 1 416 176 L336 176 Z" fill="#907AF9"/>
    <!-- bowl, row 2 -->
    <rect x="96" y="176" width="80" height="80" fill="#6247EA"/>
    <rect x="176" y="176" width="80" height="80" fill="#7653F6"/>
    <rect x="256" y="176" width="80" height="80" fill="#907AF9"/>
    <path d="M336 176 L416 176 A80 80 0 0 1 336 256 Z" fill="#A79CF7"/>
