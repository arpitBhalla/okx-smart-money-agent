<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Polydash: the Datadash grid mark drawn as a P, on the same 3x4 proportions and palette as the Datadash D.
       Cells shade dark to light along the diagonal. -->
