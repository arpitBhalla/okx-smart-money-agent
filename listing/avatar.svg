  <rect x="124" y="80" width="88" height="88" fill="#4E3DC9"/>
  <rect x="212" y="80" width="88" height="88" fill="#7653F6"/>
  <path d="M300 80 A88 88 0 0 1 388 168 L300 168 Z" fill="#907AF9"/>
  <!-- bowl, bottom row -->
  <rect x="124" y="168" width="88" height="88" fill="#7653F6"/>
  <rect x="212" y="168" width="88" height="88" fill="#907AF9"/>
  <path d="M300 168 L388 168 A88 88 0 0 1 300 256 Z" fill="#CECAFF"/>
  <!-- stem -->
  <rect x="124" y="256" width="88" height="88" fill="#907AF9"/>
  <rect x="124" y="344" width="88" height="88" fill="#CECAFF"/>
</svg>
